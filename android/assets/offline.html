<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; box-sizing: border-box;
      background: #0E261E; color: #fff; font-family: sans-serif; text-align: center; }
    main { max-width: 22rem; }
    .logo { font-size: 1.7rem; font-weight: 800; }
    .logo span { color: #9BD13D; }
    h1 { font-size: 1.35rem; margin: 1.25rem 0 .5rem; }
    p { color: rgba(255,255,255,.8); line-height: 1.5; }
    a { display: inline-block; margin-top: 1rem; padding: .85rem 1.8rem; border-radius: 999px; background: #9BD13D; color: #10261e; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="logo">Plasti<span>Link</span></div>
    <h1>Can't reach PlastiLink</h1>
    <p>Check your mobile data or Wi-Fi, and that you are on the same network as the PlastiLink server if you are testing. Nothing has been lost or changed.</p>
    <a href="plastilink-retry:go">Try again</a>
  </main>
</body>
</html>
